name: Sync to Hugging Face Hub

on:
  push:
    branches: [main, master] # Works for both names
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use HEAD to push whatever branch is currently active
          git push -f https://Botcloud:$HF_TOKEN@huggingface.co/spaces/Botcloud/my-claw-agent HEAD:main